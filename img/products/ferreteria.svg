    <line x1="0" y1="60" x2="400" y2="60"/><line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="240" x2="400" y2="240"/>
  </g>
  <!-- Martillo -->
  <g transform="translate(200,150) rotate(-20)">
